[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "talents-hub-backend"
version = "0.1.0"
description = "Backend for Talents Hub"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "channels[daphne]>=4.2,<5",
  "channels-redis>=4.2,<5",
  "django-allauth[socialaccount]>=65,<66",
  "django-cors-headers>=4.7,<5",
  "django-filter>=25.1,<26",
  "django-redis>=5.4,<6",
  "django-storages[s3]>=1.14,<2",
  "djangorestframework>=3.15,<4",
  "drf-spectacular>=0.28,<1",
  "celery[redis]>=5.5,<6",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.36,<2",
  "django-environ>=0.12,<1",
  "Pillow>=11,<12",
  "requests>=2.32,<3",
  "sentry-sdk[celery,django]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "django-stubs[compatible-mypy]>=5.1,<6",
  "factory-boy>=3.3,<4",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-django>=4.10,<5",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]
addopts = "--reuse-db --strict-markers --cov=apps --cov=config --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
omit = [
  "*/migrations/*",
  "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["allauth.*", "celery.*", "channels", "channels.*", "environ", "rest_framework.*", "storages.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.local"
strict_model_abstract_attrs = false
