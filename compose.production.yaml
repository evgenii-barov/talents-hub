name: talents-hub-production

x-backend-environment: &backend-environment
  env_file:
    - ${PRODUCTION_ENV_FILE:-./.env.production}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  db:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  media-init:
    <<: *service-defaults
    image: busybox:1.37
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /media/uploads && chown -R 10001:10001 /media
    restart: "no"
    read_only: true
    network_mode: none
    volumes:
      - media_data:/media

  backend:
    <<: [*service-defaults, *backend-environment]
    build:
      context: ./backend
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    networks:
      - edge
      - data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from urllib.request import Request, urlopen; host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); urlopen(Request('http://127.0.0.1:8000/api/ready/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}), timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery:
    <<: [*service-defaults, *backend-environment]
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      RUN_MIGRATIONS: "0"
    command: celery -A config worker --loglevel=INFO
    networks:
      - edge
      - data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    expose:
      - "3000"
    environment:
      INTERNAL_API_URL: http://backend:8000/api
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  glitchtip-db:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${GLITCHTIP_POSTGRES_DB}
      POSTGRES_USER: ${GLITCHTIP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD}
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  glitchtip-valkey:
    <<: *service-defaults
    image: valkey/valkey:9
    volumes:
      - glitchtip_valkey_data:/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  glitchtip:
    <<: *service-defaults
    image: registry.gitlab.com/glitchtip/glitchtip:6
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL}
      VALKEY_URL: redis://glitchtip-valkey:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: consolemail://
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      ALLOWED_HOSTS: ${GLITCHTIP_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${GLITCHTIP_CSRF_TRUSTED_ORIGINS}
      SERVER_ROLE: all_in_one
      ENABLE_ADMIN: "False"
      ENABLE_OPENAPI: "False"
      ENABLE_USER_REGISTRATION: "False"
      ENABLE_SOCIAL_APPS_USER_REGISTRATION: "False"
      ENABLE_ORGANIZATION_CREATION: "False"
      GLITCHTIP_ENABLE_LOGS: "False"
      GLITCHTIP_ENABLE_MCP: "False"
      GLITCHTIP_ENABLE_DUCKDB: "False"
      GLITCHTIP_RETENTION_DAYS: "30"
      GLITCHTIP_EVENT_HOT_DAYS: "14"
      GLITCHTIP_TRANSACTION_RETENTION_DAYS: "14"
      GLITCHTIP_UPTIME_RETENTION_DAYS: "30"
      GLITCHTIP_FILE_RETENTION_DAYS: "30"
      VTASKS_CONCURRENCY: "4"
      DATABASE_POOL_MAX_SIZE: "4"
      GRANIAN_WORKERS: "1"
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
    volumes:
      - glitchtip_uploads:/code/uploads
    networks:
      - edge
      - monitoring
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from urllib.parse import urlparse; from urllib.request import Request, urlopen; host = urlparse(os.environ['GLITCHTIP_DOMAIN']).hostname; urlopen(Request('http://127.0.0.1:8000/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}), timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  umami-db:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    networks:
      - analytics
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  umami:
    <<: *service-defaults
    image: ghcr.io/umami-software/umami:3.3.1
    init: true
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      APP_SECRET: ${UMAMI_APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY}
      DISABLE_TELEMETRY: "1"
      PRIVATE_MODE: "1"
      TRACKER_SCRIPT_NAME: th.js
      COLLECT_API_ENDPOINT: /api/th
      SALT_ROTATION: month
      USE_UUIDV7: "1"
      DEFAULT_LOCALE: en-US
    networks:
      - edge
      - analytics
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:3000/api/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    <<: *service-defaults
    image: caddy:2-alpine
    env_file:
      - ${PRODUCTION_ENV_FILE:-./.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  edge:
  data:
    internal: true
  monitoring:
    internal: true
  analytics:
    internal: true

volumes:
  postgres_data:
  redis_data:
  media_data:
  caddy_data:
  caddy_config:
  glitchtip_postgres_data:
  glitchtip_valkey_data:
  glitchtip_uploads:
  umami_postgres_data:
